<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrot Creek Generator</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <style>
        /* === INDEX.HTML CSS REPLICATED === */
        body {
            font-family: Arial, sans-serif;
            background-color: #ff9900;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #f57c00; /* carrot orange */
            color: white;
            padding: 25px;
            text-align: center;
        }

        span {
            font-size: 2em;       /* same size as h1 */
            font-weight: bold;
            line-height: 1.2;
            font-family: inherit;
        }

        nav {
            background-color: #388e3c; /* green */
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: rgb(0, 255, 115);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        article {
            margin-bottom: 40px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #f57c00;
        }

        footer {
            background-color: #2e7d32; /* darker green */
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 50px;
        }

        .title-logo {
            width: 50px;
            height: 50px;
            vertical-align: middle;
            margin-right: 10px;
        }

        /* === Generator buttons centered === */
        .generator-buttons {
            display: flex;
            justify-content: center; /* center horizontally */
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .generator-buttons button {
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            background-color: #4CAF50;
            color: white;
            transition: background 0.2s;
        }
        .generator-buttons button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <img src="../favicon.png" alt="Logo" class="title-logo">
    <span>Carrot Creek Generator</span>
    <p>Hidden page for generating newspapers and editing presets. Choose where to go below.</p>
</header>

<!-- Navigation (same as index.html) -->
<nav>
    <a href="../index.html">Home</a>
    <a href="../news.html">News</a>
    <a href="../news-archives.html">News Archives</a>
    <a href="../events.html">Events</a>
    <a href="../join-us.html">Join Us</a>
</nav>

<!-- Main Content -->
<main>
    <article>
        <div class="generator-buttons">
            <button onclick="window.location.href='editor.html'">Newspaper Preset Editor</button>
            <button onclick="window.location.href='generator.html'">Newspaper Generator</button>
        </div>
    </article>

    <article>
        <h2>Hidden Tools</h2>
        <p>This page is hidden from the main navigation.</p>
        <!-- add more hidden tools or generators here later -->
    </article>
</main>

<!-- Footer -->
<footer>
    <p>© 2026 Carrot Creek Server</p>
</footer>

</body>
</html>
